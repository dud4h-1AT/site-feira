<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - SolveHub</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h1>Criar Conta</h1>

<p>Escolha seu perfil</p>

<select id="tipoUsuario">

<option value="">Selecione</option>

<option value="empresa">🏢 Empresa</option>

<option value="inovador">💡 Inovador</option>

</select>

<form id="cadastroForm">

<input
type="text"
placeholder="Nome"
required>

<input
type="email"
placeholder="E-mail"
required>

<div id="campoExtra"></div>

<input
type="password"
placeholder="Senha"
required>

<button>

Cadastrar

</button>

</form>

<p>

Já possui conta?

<a href="login.html">

Entrar

</a>

</p>

</div>

</div>

<script>

const tipo = document.getElementById("tipoUsuario");

const campo = document.getElementById("campoExtra");

tipo.addEventListener("change",()=>{

if(tipo.value=="empresa"){

campo.innerHTML=`

<input
type="text"
placeholder="Nome da Empresa"
required>

<input
type="text"
placeholder="CNPJ"
required>

`;

}

else if(tipo.value=="inovador"){

campo.innerHTML=`

<input
type="text"
placeholder="Área de atuação"
required>

<input
type="text"
placeholder="Cidade"
required>

`;

}

else{

campo.innerHTML="";

}

});

</script>

</body>

</html>
